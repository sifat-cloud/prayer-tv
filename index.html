<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Prayer Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/bundles/adhan.umd.js"></script>
  <style>
    :root {
      --bg: #090c10;
      --card-bg: rgba(22, 27, 34, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --text: #f0f6fc;
      --text-muted: #9aa4af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 4rem;
      overflow: hidden;
      transition: filter 1s ease;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.06) 0%, transparent 50%);
    }

    body.night-dim {
      filter: brightness(0.25) contrast(0.9);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-area h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .location-tag {
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .clock-area {
      text-align: right;
    }

    .current-time {
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .current-date {
      color: var(--text-muted);
      font-size: 1.2rem;
      margin-top: 0.4rem;
    }

    .status-banner {
      text-align: center;
      margin: 1.5rem 0;
      padding: 1.4rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .status-label {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .countdown-val {
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 0.3rem;
      font-variant-numeric: tabular-nums;
    }

    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1.25rem;
      margin-bottom: 1rem;
    }

    .prayer-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.2rem;
      padding: 1.6rem 1.2rem;
      text-align: center;
      transition: all 0.4s ease;
      position: relative;
    }

    .prayer-card.active-next {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.22) 0%, var(--card-bg) 100%);
      box-shadow: 0 0 25px var(--accent-glow);
      transform: translateY(-4px);
    }

    .prayer-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prayer-card.active-next .prayer-name {
      color: var(--accent);
    }

    .prayer-time {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 1rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1.2rem;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px var(--accent);
    }

    .controls-group {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    button.btn-ctrl {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button.btn-ctrl:hover {
      background: rgba(255,255,255,0.18);
    }

    button.btn-ctrl.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>SALAH TIME</h1>
      <div class="location-tag">
        <span>📍 Brooklyn, NY</span>
        <span style="color: var(--text-muted); font-weight: 400;">• ISNA Method</span>
      </div>
    </div>
    <div class="clock-area">
      <div class="current-time" id="clock">--:--:--</div>
      <div class="current-date" id="date-label">Loading date...</div>
    </div>
  </header>

  <div class="status-banner">
    <div class="status-label" id="status-label">Next Prayer Countdown</div>
    <div class="countdown-val" id="countdown">--:--:--</div>
  </div>

  <div class="prayer-grid" id="prayer-cards">
    <div class="prayer-card" id="card-fajr">
      <div class="prayer-name">Fajr</div>
      <div class="prayer-time" id="time-fajr">--:--</div>
    </div>
    <div class="prayer-card" id="card-sunrise">
      <div class="prayer-name">Sunrise</div>
      <div class="prayer-time" id="time-sunrise">--:--</div>
    </div>
    <div class="prayer-card" id="card-dhuhr">
      <div class="prayer-name">Dhuhr</div>
      <div class="prayer-time" id="time-dhuhr">--:--</div>
    </div>
    <div class="prayer-card" id="card-asr">
      <div class="prayer-name">Asr</div>
      <div class="prayer-time" id="time-asr">--:--</div>
    </div>
    <div class="prayer-card" id="card-maghrib">
      <div class="prayer-name">Maghrib</div>
      <div class="prayer-time" id="time-maghrib">--:--</div>
    </div>
    <div class="prayer-card" id="card-isha">
      <div class="prayer-name">Isha</div>
      <div class="prayer-time" id="time-isha">--:--</div>
    </div>
  </div>

  <footer>
    <div>
      <span class="status-indicator"></span>
      <span id="screen-mode-text">Active Bright Display</span>
    </div>
    <div class="controls-group">
      <button class="btn-ctrl" id="fullscreen-btn" onclick="toggleFullScreen()">⛶ Full Screen</button>
      <button class="btn-ctrl" id="test-btn" onclick="testAudio()">▶ Test Adhan</button>
      <button class="btn-ctrl" id="audio-toggle" onclick="enableAudio()">🔊 Enable Audio</button>
    </div>
  </footer>

  <!-- Plays the adhan.mp3 file directly from your repository -->
  <audio id="adhan-audio" preload="auto">
    <source src="adhan.mp3" type="audio/mpeg">
  </audio>

  <script>
    const LATITUDE = 40.6782;
    const LONGITUDE = -73.9442;

    const audio = document.getElementById('adhan-audio');
    const audioBtn = document.getElementById('audio-toggle');
    const fsBtn = document.getElementById('fullscreen-btn');
    let audioUnlocked = false;
    let playedPrayersToday = {};

    // 1. One-click Fullscreen function for TV / Browser
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Error attempting to enable full-screen: ${err.message}`);
        });
        fsBtn.innerText = "Exit Full Screen";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fsBtn.innerText = "⛶ Full Screen";
        }
      }
    }

    // 2. Audio enablement
    function enableAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audioUnlocked = true;
        audioBtn.classList.add('active');
        audioBtn.innerText = "✔ Adhan Ready";
      }).catch(err => {
        // Unlocks even if playback is waiting
        audioUnlocked = true;
        audioBtn.classList.add('active');
        audioBtn.innerText = "✔ Audio Armed";
      });
    }

    // 3. Test Adhan Button
    function testAudio() {
      audio.currentTime = 0;
      audio.play().then(() => {
        audioUnlocked = true;
        audioBtn.classList.add('active');
        audioBtn.innerText = "✔ Playing Adhan";
      }).catch(err => {
        alert("Make sure 'adhan.mp3' is uploaded to the repository! Details: " + err.message);
      });
    }

    // Unlock on click anywhere
    window.addEventListener('click', () => {
      if (!audioUnlocked) enableAudio();
    }, { once: true });

    function formatTime(date) {
      if (!date) return '--:--';
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function calculatePrayers() {
      const coordinates = new adhan.Coordinates(LATITUDE, LONGITUDE);
      const params = adhan.CalculationMethod.NorthAmerica();
      params.madhab = adhan.Madhab.Hanafi;
      const today = new Date();
      return new adhan.PrayerTimes(coordinates, today, params);
    }

    function update() {
      const now = new Date();
      
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      document.getElementById('date-label').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      const prayers = calculatePrayers();
      if (!prayers) return;

      const schedule = [
        { key: 'fajr', name: 'Fajr', time: prayers.fajr, isPrayer: true },
        { key: 'sunrise', name: 'Sunrise', time: prayers.sunrise, isPrayer: false },
        { key: 'dhuhr', name: 'Dhuhr', time: prayers.dhuhr, isPrayer: true },
        { key: 'asr', name: 'Asr', time: prayers.asr, isPrayer: true },
        { key: 'maghrib', name: 'Maghrib', time: prayers.maghrib, isPrayer: true },
        { key: 'isha', name: 'Isha', time: prayers.isha, isPrayer: true }
      ];

      schedule.forEach(p => {
        document.getElementById(`time-${p.key}`).innerText = formatTime(p.time);
      });

      let next = schedule.find(p => p.time > now);
      let targetTime, targetName, isTomorrow = false;

      if (!next) {
        const tomorrow = new Date(now);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const coords = new adhan.Coordinates(LATITUDE, LONGITUDE);
        const params = adhan.CalculationMethod.NorthAmerica();
        const tomorrowPrayers = new adhan.PrayerTimes(coords, tomorrow, params);
        targetTime = tomorrowPrayers.fajr;
        targetName = 'Fajr (Tomorrow)';
        isTomorrow = true;
      } else {
        targetTime = next.time;
        targetName = next.name;
      }

      document.querySelectorAll('.prayer-card').forEach(card => card.classList.remove('active-next'));
      if (!isTomorrow && next) {
        const activeCard = document.getElementById(`card-${next.key}`);
        if (activeCard) activeCard.classList.add('active-next');
      }

      const diffMs = targetTime - now;
      const diffSecTotal = Math.max(0, Math.floor(diffMs / 1000));
      const diffMinTotal = Math.floor(diffSecTotal / 60);

      const hours = Math.floor(diffSecTotal / 3600);
      const mins = Math.floor((diffSecTotal % 3600) / 60);
      const secs = diffSecTotal % 60;

      document.getElementById('status-label').innerText = `Countdown to ${targetName}`;
      document.getElementById('countdown').innerText = 
        `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      // Night Dim: 11:30 PM to 5:00 AM (brightens 20m before Fajr)
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();
      const isLateNightSleep = (currentHour === 23 && currentMin >= 30) || (currentHour < 5);
      const isNearPrayer = diffMinTotal <= 20;

      const body = document.body;
      const statusText = document.getElementById('screen-mode-text');

      if (isLateNightSleep && !isNearPrayer) {
        body.className = 'night-dim';
        statusText.innerText = 'Night Sleep Mode (Dimmed)';
      } else {
        body.className = '';
        statusText.innerText = 'Active Bright Display';
      }

      // Adhan trigger at prayer second
      schedule.filter(p => p.isPrayer).forEach(p => {
        const prayerDiff = Math.abs(now - p.time);
        const prayerKey = `${p.key}-${now.toDateString()}`;
        if (prayerDiff < 1500 && !playedPrayersToday[prayerKey]) {
          playedPrayersToday[prayerKey] = true;
          body.className = '';
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Adhan blocked:', e));
          }
        }
      });
    }

    setInterval(update, 1000);
    update();
  </script>
</body>
</html>
